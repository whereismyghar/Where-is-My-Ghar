<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f8f6" />
    <link rel="stylesheet" href="/theme-tokens.css" />
    <link rel="stylesheet" href="/safe-area.css" />
    <script src="/i18n-runtime.js"></script>
    <title>No Internet Connection | Where Is My Ghar</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100%;
        margin: 0;
        padding-inline: 24px;
        color: var(--wimg-text);
        background: var(--wimg-page);
        font-family: Poppins, sans-serif;
      }
      .offline-content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      main {
        width: min(100%, 420px);
        flex: 0 0 auto;
        margin-block: auto;
        padding: 36px 32px;
        border: 1px solid var(--wimg-border);
        border-radius: 16px;
        background: var(--wimg-surface);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      .icon {
        display: grid;
        width: 112px;
        height: 112px;
        margin: 0 auto 24px;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--wimg-surface), var(--wimg-icon-tint));
        box-shadow: inset 0 2px 8px rgba(255,255,255,.9), 0 12px 24px rgba(8,64,55,.18);
        animation: float 3s ease-in-out infinite;
      }
      h1 { margin: 0; font-size: 22px; line-height: 1.3; }
      p { max-width: 330px; margin: 12px auto 0; color: var(--wimg-text-muted); font-size: 14px; line-height: 1.7; }
      .icon svg { stroke: var(--wimg-primary); }
      button {
        display: inline-flex;
        width: 100%;
        min-height: 48px;
        margin-top: 28px;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 12px;
        color: white;
        background: linear-gradient(135deg, var(--wimg-primary) 0%, var(--wimg-primary-strong) 100%);
        box-shadow: 0 6px 0 #032f27, 0 12px 22px rgba(5,64,53,.24);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform .18s ease, box-shadow .18s ease;
      }
      button:active { transform: translateY(4px); box-shadow: 0 2px 0 #032f27; }
      @keyframes float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
      @media (prefers-reduced-motion: reduce) { .icon { animation: none; } }
    </style>
    <script>
      (() => {
        let language = null;
        let theme = null;
        try {
          language = localStorage.getItem('userLanguage');
          if (!['en', 'hi', 'hinglish'].includes(language)
            && localStorage.getItem('hasOnboarded') === 'true') {
            language = localStorage.getItem('wimg_app_language');
          }
          theme = localStorage.getItem('wimg-theme');
        } catch {
          language = null;
          theme = null;
        }
        const requestedLanguage = new URLSearchParams(window.location.search).get('lang');
        language = window.wimgI18n.resolveLanguage([requestedLanguage, language], 'en');
        theme = ['light', 'dark', 'system'].includes(theme) ? theme : 'system';
        document.documentElement.dataset.language = language;
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = language === 'hi' ? 'hi' : language === 'hinglish' ? 'hi-Latn' : 'en';
        const themeColor = document.querySelector('meta[name="theme-color"]');
        const updateThemeColor = () => {
          const dark = theme === 'dark'
            || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          themeColor?.setAttribute('content', dark ? '#020617' : '#f4f8f6');
        };
        updateThemeColor();
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateThemeColor);
        window.addEventListener('storage', (event) => {
          if (event.key === 'wimg-theme') {
            theme = ['light', 'dark', 'system'].includes(event.newValue) ? event.newValue : 'system';
            document.documentElement.dataset.theme = theme;
            updateThemeColor();
          } else if (['hasOnboarded', 'userLanguage', 'wimg_app_language'].includes(event.key)) {
            window.location.reload();
          }
        });
      })();
    </script>
  </head>
  <body class="app-background app-safe-area">
    <div class="safe-area-scroll-body offline-content">
      <main role="alert">
        <div class="icon" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#083b33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h.01" />
            <path d="M8.5 16.429a5 5 0 0 1 7 0" />
            <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
            <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
            <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
            <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
            <path d="m2 2 20 20" />
          </svg>
        </div>
        <h1>No Internet Connection</h1>
        <p id="status">Please check your network settings and try again to explore properties.</p>
        <button type="button" onclick="window.location.reload()">Try Again</button>
      </main>
    </div>
    <script>
      const copy = {
        en: {
          title: 'No Internet Connection | Where Is My Ghar',
          heading: 'No Internet Connection',
          offline: 'Please check your network settings and try again to explore properties.',
          online: 'Connection restored. Select Try Again to continue.',
          retry: 'Try Again',
        },
        hi: {
          title: 'इंटरनेट कनेक्शन नहीं है | Where Is My Ghar',
          heading: 'इंटरनेट कनेक्शन नहीं है',
          offline: 'प्रॉपर्टी देखने के लिए नेटवर्क सेटिंग्स जाँचें और फिर कोशिश करें।',
          online: 'कनेक्शन वापस आ गया है। आगे बढ़ने के लिए फिर कोशिश करें चुनें।',
          retry: 'फिर कोशिश करें',
        },
        hinglish: {
          title: 'Internet connection nahi hai | Where Is My Ghar',
          heading: 'Internet connection nahi hai',
          offline: 'Properties dekhne ke liye network settings check karke phir try karein.',
          online: 'Connection wapas aa gaya. Aage badhne ke liye Try Again chunein.',
          retry: 'Phir try karein',
        },
      };
      const language = document.documentElement.dataset.language || 'en';
      const renderStatus = () => {
        document.title = window.wimgI18n.t(language, copy, 'title');
        document.querySelector('h1').textContent = window.wimgI18n.t(language, copy, 'heading');
        document.getElementById('status').textContent = window.wimgI18n.t(
          language,
          copy,
          navigator.onLine ? 'online' : 'offline',
        );
        document.querySelector('button').textContent = window.wimgI18n.t(language, copy, 'retry');
      };
      window.addEventListener('online', renderStatus);
      window.addEventListener('offline', renderStatus);
      let reconnecting = false;
      const reconnect = async () => {
        if (!navigator.onLine || reconnecting) return;
        reconnecting = true;
        const controller = new AbortController();
        const timeoutId = window.setTimeout(() => controller.abort(), 5000);
        try {
          const probeUrl = new URL('/', window.location.origin);
          probeUrl.searchParams.set('wimg-connectivity-probe', String(Date.now()));
          const response = await fetch(probeUrl, {
            cache: 'no-store',
            signal: controller.signal,
          });
          if (response.ok) {
            await response.body?.cancel();
            window.location.reload();
          } else {
            reconnecting = false;
          }
        } catch {
          reconnecting = false;
        } finally {
          window.clearTimeout(timeoutId);
        }
      };
      window.addEventListener('online', () => { void reconnect(); });
      window.setInterval(() => { void reconnect(); }, 15000);
      renderStatus();
      void reconnect();
    </script>
  </body>
</html>
