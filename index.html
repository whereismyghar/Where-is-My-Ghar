      (() => {
        let mode = 'system';
        try {
          const savedMode = localStorage.getItem('wimg-theme');

            mode = savedMode;
          }
        } catch (error) {

        const dark = mode === 'dark'
          || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = mode;
        document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#020617' : '#f4f8f6');
      })();
    </script>
