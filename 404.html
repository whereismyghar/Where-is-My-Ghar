<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      const propertyRoute = window.location.pathname.match(/^\/property\/([\w-]+)\/?$/);
      if (propertyRoute) {
        const target = new URL('/', window.location.origin);
        target.search = window.location.search;
        target.searchParams.set('property', propertyRoute[1]);
        target.hash = window.location.hash;
        window.location.replace(target.href);
      }
    </script>
    <title>Page not found</title>
  </head>
  <body></body>
</html>
